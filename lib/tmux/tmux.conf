## GLOBAL OPTIONS ###############################
#################################################

set -g mouse on
set -g allow-rename off
set -g set-clipboard external
set -g detach-on-destroy off
set -g renumber-windows on
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 1
setw -g mode-keys vi
setw -g aggressive-resize on

## NeoVim/LazyVim Compatibility
set -sg escape-time 0
set -g focus-events on
set -a terminal-features 'xterm-256color:RGB'


## BINDINGS #####################################
#################################################

## Tmux: Leader Key
unbind C-b
set -g prefix M-a
bind-key M-a send-prefix

## Tmux: Source Config
bind R source-file ~/.tmux.conf

## Copy Mode: Clipboard Control
# bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -i -f -selection primary | xclip -i -selection clipboard'
bind -T copy-mode-vi c send-keys -X copy-pipe-and-cancel 'xclip -i -f -selection primary | xclip -i -selection clipboard'

bind -n M-\; command-prompt
## Session: Navigation
bind -n M-y switch-client -n
bind -n M-t switch-client -p

## Window: Splitting
bind \\ split-window -h; unbind '"'
bind - split-window -v; unbind %

## Window: Navigation
bind -n M-h next-window
bind -n M-g previous-window
bind a last-window

## Pane: Navigation
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
bind -n M-Right select-pane -t :.+
bind -n M-Left select-pane -t :.-
bind -n M-b last-pane
bind -n C-Right rotate-window

## Pane: Geometry
bind -n M-f resize-pane -Z # Full size
bind -n C-S-Right resizep -R
bind -n C-S-Left resizep -L
bind -n C-S-Up resizep -U
bind -n C-S-Down resizep -D

## Pane: Management
bind-key x kill-pane


