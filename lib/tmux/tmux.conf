## PLUGINS ######################################
#################################################

## Core Plugins
set -g @plugin 'tmux-plugins/tpm'

## Session Management
bind -n M-s run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

## Status Bar
set -g @plugin 'worldshredder/tmux2k'
    # https://stackoverflow.com/a/40902312
    set -g @T2K_BASE_SCHEME 'simple'

    ## TMUX2K CORE SETTINGS ######################
    ##############################################
    set -g @tmux2k-refresh-rate '1'
    set -g @tmux2k-theme 'duo'
    set -g @tmux2k-icons-only 'true'
    # Status bar plugins
    set -g @tmux2k-left-plugins 'session git cwd'
    set -g @tmux2k-right-plugins 'cpu ram time'
    # Status bar elements
    set -g @tmux2k-cwd-length 20
    set -g @tmux2k-cwd-min-depth 8
    set -g @tmux2k-cwd-prefix-chars 3
    set -g @tmux2k-time-format '%H:%M:%S %Z'
    set -g @tmux2k-window-list-compact 'true'
    set -g @tmux2k-git-display-status 'false'
    # Status Bar Icons
    set -g @tmux2k-session-icon ''
    set -g @tmux2k-ram-icon ''
    set -g @tmux2k-time-icon ''
    # Git Plugin Icons
    # Original: added= modified= updated= deleted= diff= repo= no-repo= 
    set -g @tmux2k-git-added-icon '#[fg=#{@GREEN}]󰻭#[fg=#{@ALPHA_600}]'
    set -g @tmux2k-git-modified-icon '#[fg=#{@YELLOW}]󰕁#[fg=#{@ALPHA_600}]'
    set -g @tmux2k-git-updated-icon '#[fg=#{@YELLOW}]󰩎#[fg=#{@ALPHA_600}]'
    set -g @tmux2k-git-deleted-icon '#[fg=#{@ORANGE}]󱪢#[fg=#{@ALPHA_600}]'
    set -g @tmux2k-git-untracked-icon '#[fg=#{@RED}]#[fg=#{@ALPHA_600}]'
    set -g @tmux2k-git-diff-icon '#[fg=#{@BLUE}]'
    set -g @tmux2k-git-diff-icon ''
    set -g @tmux2k-git-repo-icon '#[fg=#{@GREEN}]'
    set -g @tmux2k-git-no-repo-icon '#[fg=#{@RED}]#[fg=#{@ALPHA_800}]'
    set -g @tmux2k-git-status-filter 'AMURDX'

    set -g @tmux2k-cpu-display-usage 'true'
    set -g @tmux2k-cpu-display-load 'true'
    set -g @tmux2k-cpu-usage-average '5'
    set -g @tmux2k-cpu-usage-decimal 'false'
    set -g @tmux2k-cpu-load-averages '1m'
    set -g @tmux2k-cpu-load-percent 'false'
    set -g @tmux2k-cpu-load-normalize 'true'
    set -g @tmux2k-cpu-icon-link-to ''
    set -g @tmux2k-cpu-gradient 'cosmic'

    ## TMUX2K COLOR SCHEME #######################
    ##############################################
    if-shell '[ "#{@T2K_BASE_SCHEME}" = "simple" ]' {
        set -g @tmux2k-icons-only 'true'
        set -g @tmux2k-show-powerline 'false'
        # Status Bar Colors
        set -g @tmux2k-duo-fg '#{@ALPHA_700}'
        set -g @tmux2k-duo-bg '#{@ALPHA_300}'
        set -g @tmux2k-text '#{@ALPHA_200}'
        set -g @tmux2k-bg-main '#{@ALPHA_100}'
        set -g @tmux2k-bg-alt '#{@BETA_500}'
        # Commandline Colors
        set -g @tmux2k-message-fg '#{@ALPHA_800}'
        set -g @tmux2k-message-bg '#{@ALPHA_100}'
        set -g @tmux2k-pane-border '#{@ALPHA_100}'
        set -g @tmux2k-pane-active-border '#{@ALPHA_300}'
        set -g @tmux2k-pane-active-border-bg '#{@ALPHA_100}'
        # Session Prefix Highlight
        set -g @tmux2k-prefix-highlight '#{@BETA_300}'
        # Plugin-Specific Colors
        set -g @tmux2k-session-icon '#[fg=#{@BETA_700}]#[fg=#{@BETA_700}]'
        set -g @tmux2k-session-colors 'text duo_bg'
        set -g @tmux2k-window-list-colors 'duo_fg text'
    }
    if-shell '[ "#{@T2K_BASE_SCHEME}" = "powerlines" ]' {
        set -g @tmux2k-theme 'duo'
        set -g @tmux2k-icons-only 'false'
        set -g @tmux2k-show-powerline 'true'
        # Status Bar Colors
        set -g @tmux2k-duo-bg '#{@ALPHA_100}'
        set -g @tmux2k-duo-fg '#{@ALPHA_200}'
        set -g @tmux2k-text '#{@ALPHA_800}'
        set -g @tmux2k-bg-main '#{@ALPHA_100}'
        set -g @tmux2k-bg-alt '#{@BETA_500}'
        # Commandline Colors
        set -g @tmux2k-message-fg '#{@ALPHA_800}'
        set -g @tmux2k-message-bg '#{@ALPHA_100}'
        set -g @tmux2k-pane-border '#{@ALPHA_100}'
        set -g @tmux2k-pane-active-border '#{@ALPHA_300}'
        set -g @tmux2k-pane-active-border-bg '#{@ALPHA_100}'
        # Session Prefix Highlight
        set -g @tmux2k-prefix-highlight '#{@BETA_300}'
        # Plugin-Specific Colors
        set -g @tmux2k-session-icon '#[fg=#{@BETA_700}]#[fg=#{@BETA_700}]'
        set -g @tmux2k-session-colors 'duo_bg text'
        set -g @tmux2k-window-list-colors 'duo_bg bg_alt'
    }

## Pre-Init
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

## Initialize
run '~/.tmux/plugins/tpm/tpm'
